<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Drop it on every mic. Press play. Done.</title>
  <desc>Step 1: put TIM-Automixer on every microphone track. Step 2: press play, the instances link automatically. Step 3: each voice stays clean, the right mic is always open.</desc>
  <rect width="960" height="300" rx="18" fill="#121417"/>

  <!-- ===== Étape 1 : un plugin par piste ===== -->
  <g transform="translate(32 32)">
    <rect width="272" height="236" rx="12" fill="#1a1d21"/>
    <circle cx="28" cy="30" r="13" fill="#4fc3e8"/>
    <text x="28" y="35" fill="#121417" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="52" y="35" fill="#e9ebee" font-size="15" font-weight="600">Drop it on every mic</text>

    <g font-size="12">
      <!-- piste -->
      <rect x="16" y="64" width="240" height="40" rx="8" fill="#22262b"/>
      <rect x="16" y="64" width="4" height="40" rx="2" fill="#4fc3e8"/>
      <text x="32" y="89" fill="#e9ebee">Interviewer</text>
      <rect x="132" y="74" width="112" height="20" rx="5" fill="#183039"/>
      <text x="188" y="88" fill="#4fc3e8" font-size="11" text-anchor="middle" font-weight="600">TIM-Automixer</text>

      <rect x="16" y="114" width="240" height="40" rx="8" fill="#22262b"/>
      <rect x="16" y="114" width="4" height="40" rx="2" fill="#b18cf5"/>
      <text x="32" y="139" fill="#e9ebee">Guest A</text>
      <rect x="132" y="124" width="112" height="20" rx="5" fill="#183039"/>
      <text x="188" y="138" fill="#4fc3e8" font-size="11" text-anchor="middle" font-weight="600">TIM-Automixer</text>

      <rect x="16" y="164" width="240" height="40" rx="8" fill="#22262b"/>
      <rect x="16" y="164" width="4" height="40" rx="2" fill="#f2b45a"/>
      <text x="32" y="189" fill="#e9ebee">Guest B</text>
      <rect x="132" y="174" width="112" height="20" rx="5" fill="#183039"/>
      <text x="188" y="188" fill="#4fc3e8" font-size="11" text-anchor="middle" font-weight="600">TIM-Automixer</text>
    </g>
  </g>

  <!-- flèche -->
  <path d="M314 150 H334" stroke="#5c646e" stroke-width="2" stroke-linecap="round"/>
  <path d="M329 144 L335 150 L329 156" fill="none" stroke="#5c646e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Étape 2 : lecture, liaison automatique ===== -->
  <g transform="translate(344 32)">
    <rect width="272" height="236" rx="12" fill="#1a1d21"/>
    <circle cx="28" cy="30" r="13" fill="#4fc3e8"/>
    <text x="28" y="35" fill="#121417" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="52" y="35" fill="#e9ebee" font-size="15" font-weight="600">Press play</text>

    <circle cx="136" cy="118" r="34" fill="#183039"/>
    <path d="M126 100 L152 118 L126 136 Z" fill="#4fc3e8"/>

    <circle cx="86" cy="182" r="4" fill="#3ddc84"/>
    <text x="96" y="186" fill="#9aa3ad" font-size="13">3 mics linked</text>
    <text x="136" y="214" fill="#5c646e" font-size="12" text-anchor="middle">They find each other automatically.</text>
  </g>

  <!-- flèche -->
  <path d="M626 150 H646" stroke="#5c646e" stroke-width="2" stroke-linecap="round"/>
  <path d="M641 144 L647 150 L641 156" fill="none" stroke="#5c646e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Étape 3 : dialogue propre ===== -->
  <g transform="translate(656 32)">
    <rect width="272" height="236" rx="12" fill="#1a1d21"/>
    <circle cx="28" cy="30" r="13" fill="#4fc3e8"/>
    <text x="28" y="35" fill="#121417" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="52" y="35" fill="#e9ebee" font-size="15" font-weight="600">Clean dialogue</text>

    <!-- courbes de gain : chacun son tour -->
    <line x1="16" y1="72" x2="256" y2="72" stroke="#24282d"/>
    <line x1="16" y1="168" x2="256" y2="168" stroke="#24282d"/>
    <path d="M16 72 H86 C96 72 100 168 110 168 H186 C196 168 200 72 210 72 H256 V168 H16 Z" fill="#4fc3e8" fill-opacity="0.10"/>
    <path d="M16 72 H86 C96 72 100 168 110 168 H186 C196 168 200 72 210 72 H256" fill="none" stroke="#4fc3e8" stroke-width="2.5"/>
    <path d="M16 168 H90 C100 168 104 72 114 72 H160 C170 72 174 168 184 168 H256" fill="none" stroke="#b18cf5" stroke-width="2.5"/>
    <path d="M16 168 H156 C166 168 170 72 180 72 H196 C204 72 206 168 214 168 H256" fill="none" stroke="#f2b45a" stroke-width="2.5"/>
    <text x="16" y="62" fill="#5c646e" font-size="11">open</text>
    <text x="16" y="186" fill="#5c646e" font-size="11">down</text>
    <text x="136" y="214" fill="#5c646e" font-size="12" text-anchor="middle">The right mic is always open.</text>
  </g>
</svg>
